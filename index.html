<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dosis Diaria — seguimiento de hábitos</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon-v4.png" />
  <link rel="icon" href="icon-192-v4.png" />
  <meta name="theme-color" content="#0b0b0d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Dosis Diaria" />
</head>
<body>
  <div class="sheet">
    <header class="header">
      <div class="header-copy">
        <span class="eyebrow">Dosis diaria</span>
        <h1 class="date-heading" id="date-heading"></h1>
      </div>
      <div class="streak">
        <svg class="streak-flame" viewBox="0 0 24 24" aria-hidden="true">
          <defs>
            <linearGradient id="flameGradient" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" style="stop-color: var(--primary-1)" />
              <stop offset="100%" style="stop-color: var(--primary-2)" />
            </linearGradient>
          </defs>
          <path d="M12 2c1 3-3 4-3 8a3 3 0 0 0 6 0c0-1-.5-1.8-1-2.5.7.3 3 1.8 3 5.5a5 5 0 0 1-10 0c0-4.5 3.5-6 5-11z" />
        </svg>
        <span class="streak-copy">
          <span class="streak-value" id="streak-value">0</span>
          <span class="streak-label" id="streak-label">días seguidos</span>
        </span>
      </div>
    </header>

    <button class="cloud-bar" id="cloud-bar" type="button">
      <span class="cloud-dot" id="cloud-dot" aria-hidden="true"></span>
      <span id="cloud-text">Cargando estado de sincronización…</span>
    </button>

    <section class="nutrition" aria-label="Balance calórico y macros de hoy">
      <div class="history-head">
        <span class="history-title">Balance de hoy</span>
        <button class="nutrition-edit" id="nutrition-edit" type="button">Editar</button>
      </div>
      <div class="nutrition-stats" id="nutrition-stats"></div>

      <label class="time-row">
        <span class="time-row-label">Calorías consumidas hoy</span>
        <input type="number" id="input-consumed" min="0" step="1" inputmode="numeric" placeholder="kcal" />
      </label>
    </section>

    <section class="sleepfast" aria-label="Ayuno y sueño">
      <div class="history-head">
        <span class="history-title">Ayuno y sueño</span>
      </div>

      <div class="sleepfast-stats" id="sleepfast-stats"></div>

      <div class="time-grid">
        <label class="time-row">
          <span class="time-row-label">Última comida (ayer)</span>
          <input type="time" id="time-lastMeal" />
        </label>
        <label class="time-row">
          <span class="time-row-label">Rompiste el ayuno (hoy)</span>
          <input type="time" id="time-breakFast" />
        </label>
        <label class="time-row">
          <span class="time-row-label">Te fuiste a dormir (ayer)</span>
          <input type="time" id="time-bedtime" />
        </label>
        <label class="time-row">
          <span class="time-row-label">Te despertaste (hoy)</span>
          <input type="time" id="time-wake" />
        </label>
      </div>
    </section>

    <section class="habits" id="habit-list" aria-label="Metas de hoy"></section>

    <button class="add-toggle" id="add-toggle" type="button">+ Agregar meta</button>
    <form class="add-form" id="add-form">
      <div class="add-form-row">
        <input type="text" name="label" placeholder="Nombre de la meta" autocomplete="off" required />
      </div>

      <div class="type-row" id="type-row" role="radiogroup" aria-label="Tipo de métrica">
        <button type="button" class="type-option selected" data-type="toggle" role="radio" aria-checked="true">Simple</button>
        <button type="button" class="type-option" data-type="progress" role="radio" aria-checked="false">Progreso</button>
      </div>
      <p class="type-hint" id="type-hint">Se marca como cumplida o no, como "Tomar creatina".</p>

      <div class="add-form-row">
        <input type="text" name="unit" id="unit-input" placeholder="Detalle (opcional, ej. dosis 5 g)" autocomplete="off" />
      </div>

      <div class="add-form-row" id="progress-fields" hidden>
        <input type="number" name="target" placeholder="Meta diaria (ej. 8000)" min="1" step="any" inputmode="decimal" />
        <input type="number" name="step" placeholder="Incremento (ej. 500)" min="1" step="any" inputmode="decimal" />
      </div>

      <div class="swatch-row" id="swatch-row" role="radiogroup" aria-label="Color de la meta"></div>
      <button type="submit">Añadir</button>
    </form>

    <section class="history" aria-label="Historial">
      <div class="history-head">
        <span class="history-title">Últimos días</span>
        <span class="history-range" id="history-range"></span>
      </div>
      <div class="grid-wrap">
        <div class="grid" id="history-grid"></div>
      </div>
      <div class="legend">
        <span class="legend-item"><span class="legend-swatch done"></span>cumplido</span>
        <span class="legend-item"><span class="legend-swatch"></span>no cumplido</span>
        <span class="legend-item"><span class="legend-swatch none"></span>sin registro</span>
      </div>
    </section>

    <section class="training" aria-label="Entrenamiento semanal">
      <div class="history-head">
        <span class="history-title">Semana de entrenamiento</span>
        <span class="history-range" id="training-range"></span>
      </div>
      <div class="muscle-grid" id="muscle-grid"></div>
    </section>
  </div>

  <div class="profile-overlay" id="profile-overlay" hidden>
    <form class="profile-form" id="profile-form">
      <h2>Tu perfil</h2>
      <div class="add-form-row">
        <input type="number" name="weight" placeholder="Peso (kg)" min="1" step="any" inputmode="decimal" required />
        <input type="number" name="height" placeholder="Altura (cm)" min="1" step="any" inputmode="decimal" required />
      </div>
      <div class="add-form-row">
        <input type="number" name="age" placeholder="Edad" min="1" step="1" inputmode="numeric" required />
      </div>

      <div class="type-row" id="sex-row" role="radiogroup" aria-label="Sexo biológico">
        <button type="button" class="type-option selected" data-sex="m" role="radio" aria-checked="true">Hombre</button>
        <button type="button" class="type-option" data-sex="f" role="radio" aria-checked="false">Mujer</button>
      </div>

      <div class="type-row" id="goal-row" role="radiogroup" aria-label="Objetivo">
        <button type="button" class="type-option selected" data-goal="bajar" role="radio" aria-checked="true">Bajar grasa</button>
        <button type="button" class="type-option" data-goal="subir" role="radio" aria-checked="false">Subir músculo</button>
        <button type="button" class="type-option" data-goal="recomp" role="radio" aria-checked="false">Recomposición</button>
      </div>

      <div class="profile-actions">
        <button type="submit">Guardar</button>
        <button type="button" id="profile-cancel">Cancelar</button>
      </div>
    </form>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="cloud-sync.js"></script>
  <script src="script.js"></script>
</body>
</html>
